<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - مهند الخضر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
        <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>م</text></svg>">
    <link rel="icon" type="image/png" href="/favicon.png">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        #particles-js {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .glass-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            padding: 50px 40px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .logo {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        h2 {
            color: white;
            margin-bottom: 30px;
            font-weight: 600;
            font-size: 1.8rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
            text-align: right;
        }

        .input-group i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            z-index: 1;
        }

        .input-group input {
            width: 100%;
            padding: 16px 50px 16px 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            font-size: 1rem;
            color: white;
            transition: all 0.3s;
            outline: none;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .input-group input:focus {
            border-color: white;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            color: white;
            font-size: 0.95rem;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember input {
            accent-color: white;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .forgot a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 2px solid transparent;
        }

        .forgot a:hover {
            border-bottom-color: white;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 50px;
            background: white;
            color: #667eea;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .error-msg {
            margin-top: 15px;
            padding: 12px;
            border-radius: 50px;
            background: rgba(239, 68, 68, 0.2);
            color: #fecaca;
            font-weight: 600;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .register-link {
            margin-top: 25px;
            color: white;
        }

        .register-link a {
            color: white;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 2px solid transparent;
        }

        .register-link a:hover {
            border-bottom-color: white;
        }

        .demo-data {
            margin-top: 20px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: white;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>
    <div id="particles-js"></div>
    <div class="glass-card">
        <div class="logo">مهند الخضر</div>
        <h2>تسجيل الدخول</h2>
        <form id="loginForm">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="البريد الإلكتروني" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="كلمة المرور" required>
            </div>
            <div class="options">
                <label class="remember"><input type="checkbox" id="remember"> تذكرني</label>
                <div class="forgot"><a href="#">نسيت كلمة المرور؟</a></div>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">
                <span>دخول</span> <i class="fas fa-arrow-left"></i>
            </button>
            <div class="error-msg" id="errorMsg"></div>
        </form>
        <div class="register-link">ليس لديك حساب؟ <a href="register.html">سجل الآن</a></div>
    
    </div>

    <!-- ملف التكوين المركزي -->
    <script src="firebase-config.js"></script>
    <script>
   document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');

    errorMsg.style.display = 'none';
    loginBtn.disabled = true;
    loginBtn.innerHTML = '⏳ جاري التحقق...';

    try {
        // 🔥 تسجيل الدخول
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // 🔥 جلب أو إنشاء المستخدم
        const snapshot = await db.ref('users/' + user.uid).once('value');
        let data = snapshot.val();

        // 🔥 إذا غير موجود → أنشئه Admin
        if (!data) {
            data = {
                fullname: user.email,
                email: user.email,
                role: "admin"
            };

            await db.ref('users/' + user.uid).set(data);
        }

        // 🚀 التوجيه
        if (data.role === "admin" || data.role === "moderator") {
            window.location.href = "dashboard.html";
        } else {
            window.location.href = "index.html";
        }

    } catch (err) {
        errorMsg.style.display = 'block';

        if (err.code === "auth/user-not-found") {
            errorMsg.textContent = "❌ المستخدم غير موجود";
        } else if (err.code === "auth/wrong-password") {
            errorMsg.textContent = "❌ كلمة المرور غير صحيحة";
        } else {
            errorMsg.textContent = "❌ " + err.message;
        }
    } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<span>دخول</span>';
    }
});
    </script>
</body>

</html>
