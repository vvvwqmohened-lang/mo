<button id="admin-panel-btn" class="btn btn-outline" style="position:fixed;bottom:25px;left:25px;z-index:500;">لوحة التحكم</button>
<div id="admin-panel" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.45);z-index:10000;align-items:center;justify-content:center;">
  <form id="project-form" style="background:#fff;padding:32px 26px 22px 26px;border-radius:18px;width:340px;box-shadow:0 10px 40px rgba(60,60,120,0.09);direction:rtl;">
    <h3 style="margin-bottom: 20px;\">إضافة مشروع جديد</h3>
    <div style="margin-bottom:12px;"><label>اسم المشروع</label><input required name="title" style="width:100%;padding:7px 10px;margin-top:4px;"></div>
    <div style="margin-bottom:12px;"><label>الوصف</label><textarea name="desc" required style="width:100%;padding:7px 10px;margin-top:4px;resize:vertical;"></textarea></div>
    <div style="margin-bottom:12px;"><label>رابط الصورة (اختياري)</label><input name="img" style="width:100%;padding:7px 10px;margin-top:4px;"></div>
    <div style="margin-bottom:18px;"><label>رابط المشروع (اختياري)</label><input name="link" style="width:100%;padding:7px 10px;margin-top:4px;"></div>
    <button type="submit" class="btn btn-primary" style="width:100%;">إضف المشروع</button>
    <button type="button" id="close-admin" style="width:100%;margin-top:8px;" class="btn btn-outline">إغلاق</button>
  </form>
</div>
<div class="projects-grid" id="projects-list"></div>
<script>
const adminBtn = document.getElementById('admin-panel-btn');
const adminPanel = document.getElementById('admin-panel');
const closeAdmin = document.getElementById('close-admin');
const form = document.getElementById('project-form');
const projectsList = document.getElementById('projects-list');

adminBtn.onclick = ()=> adminPanel.style.display='flex';
closeAdmin.onclick = ()=> adminPanel.style.display='none';

form.onsubmit = function(e){
  e.preventDefault();
  const title = form.title.value.trim();
  const desc = form.desc.value.trim();
  const img = form.img.value.trim();
  const link = form.link.value.trim();
  const card = document.createElement('div');
  card.className = 'project-card';
  card.innerHTML = `
    <div class="project-img" style="height:220px;overflow:hidden;position:relative;">
      ${img ? `<img src="${img}" alt="${title}" style="width:100%;height:100%;object-fit:cover;">` : `<div style="display:flex;align-items:center;justify-content:center;background:#e5e7eb;height:100%">بدون صورة</div>`}
      <div class="project-overlay">
        ${link ? `<a href="${link}" target="_blank" title="معاينة المشروع"><i class="fa-solid fa-external-link"></i></a>` : ''}
      </div>
    </div>
    <div style="padding:18px">
      <h3 style="font-size:1.25rem;font-weight:700;margin-bottom:8px;">${title}</h3>
      <p style="font-size:.99rem;color:var(--gray);">${desc}</p>
    </div>
  `;
  projectsList.prepend(card);
  form.reset();
  adminPanel.style.display='none';
}
</script>
